<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Find</title>
  <desc id="desc">The Find screen: a big arrow points toward the person while the distance counts down from 8 meters to 1 meter, then the screen turns green.</desc>

  <rect width="880" height="300" rx="20" fill="#0B1020"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="92" fill="#FFFFFF" font-size="34" font-weight="700">Find</text>
    <text x="56" y="130" fill="#B4B2A9" font-size="17">Like AirTag precision finding, for people.</text>
    <text x="56" y="158" fill="#B4B2A9" font-size="17">Ultra Wideband measures distance and</text>
    <text x="56" y="182" fill="#B4B2A9" font-size="17">direction phone to phone. No GPS, no server.</text>
    <text x="56" y="236" fill="#5DCAA5" font-size="14">Location never leaves the two phones.</text>
  </g>

  <!-- Phone -->
  <g transform="translate(620 150)">
    <rect x="-92" y="-138" width="184" height="276" rx="28" fill="#1A2238" stroke="#3A4566" stroke-width="2"/>
    <rect x="-82" y="-128" width="164" height="256" rx="20" fill="#111827">
      <animate attributeName="fill" values="#111827;#1D9E75;#111827" keyTimes="0;0.7;0.95" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </rect>

    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
      <text y="-98" fill="#FFFFFF" font-size="13" font-weight="600">Finding Priya</text>

      <!-- Arrow -->
      <g>
        <path d="M0 -70 L30 -30 L11 -30 L11 22 L-11 22 L-11 -30 L-30 -30 Z" fill="#FFFFFF"/>
        <animateTransform attributeName="transform" type="rotate" values="38; -12; 8; -4; 0; 0" keyTimes="0; 0.25; 0.45; 0.6; 0.7; 1" dur="6s" repeatCount="indefinite"/>
      </g>

      <!-- Distance counting down -->
      <g font-size="34" font-weight="700" fill="#FFFFFF">
        <text y="72" opacity="1">8.0 m<animate attributeName="opacity" values="1;0" keyTimes="0;0.25" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
        <text y="72" opacity="0">4.6 m<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.45" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
        <text y="72" opacity="0">2.1 m<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.45;0.7" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
        <text y="72" opacity="0">0.9 m<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7;0.95" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
        <text y="72" opacity="0">8.0 m<animate attributeName="opacity" values="0;1" keyTimes="0;0.95" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
      </g>

      <g font-size="11" fill="#D3D1C7">
        <text y="100" opacity="1">Point the top of your phone<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.7;0.95" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
        <text y="114" opacity="1">where you're walking<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.7;0.95" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
        <text y="106" opacity="0" fill="#FFFFFF" font-size="13" font-weight="600">You're here. Say hi!<animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7;0.95" calcMode="discrete" dur="6s" repeatCount="indefinite"/></text>
      </g>
    </g>
  </g>
</svg>
